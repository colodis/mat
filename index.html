<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заказ 18.08.26 — заявка</title>
<meta name="description" content="Оставить заявку на заказ 18.08.26: ник, что заказываете, примечание.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
  body { font-family: Inter, system-ui, sans-serif; }
</style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased">
<div id="app"></div>

<script>
/* ══════════════════════════════════════════════════════════
   НАСТРОЙКА — вставьте сюда URL вашего Google Apps Script
   (см. README.md, раздел «Подключение приёма заявок»)
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  endpoint: 'PASTE_YOUR_WEB_APP_URL_HERE',
  orderTitle: 'Заказ 18.08.26',
  orderSubtitle: 'Сбор заявок',
  intro: 'Напишите ник и что заказываете. Я добавлю заявку в заказ, отмечу оплату и пришлю трекинг, когда посылка отправится.',
  afterSubmit: 'Ник — в списке. Я добавлю заявку в заказ и напишу вам.'
};

const { createApp, ref } = Vue;

createApp({
  setup() {
    const nick = ref('');
    const po = ref('');
    const note = ref('');
    const sent = ref(false);
    const sentNick = ref('');
    const submitting = ref(false);
    const error = ref('');
    const website = ref(''); // honeypot — не заполнять

    async function submit() {
      if (submitting.value || website.value) return; // honeypot: тихо "отправляем" ботам
      error.value = '';
      submitting.value = true;
      try {
        // mode: 'no-cors' — Google Apps Script не отдаёт CORS-заголовки.
        // Ответ не читаем, поэтому успех показываем после факта отправки.
        await fetch(CONFIG.endpoint, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            nick: nick.value.trim(),
            po: po.value.trim(),
            note: note.value.trim()
          })
        });
        sentNick.value = nick.value.trim();
        sent.value = true;
      } catch (e) {
        error.value = 'Не удалось отправить заявку. Попробуйте ещё раз.';
      } finally {
        submitting.value = false;
      }
    }

    function reset() {
      nick.value = '';
      po.value = '';
      note.value = '';
      sent.value = false;
    }

    return { nick, po, note, sent, sentNick, submitting, error, website, submit, reset, CONFIG };
  },
  template: `
  <main class="flex min-h-screen flex-col px-4 py-10 sm:py-16">
    <div class="mx-auto w-full max-w-xl">
      <div class="flex items-center gap-3">
        <span class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-slate-900 text-sm font-semibold text-white">18</span>
        <div>
          <p class="text-sm font-semibold text-slate-900">{{ CONFIG.orderTitle }}</p>
          <p class="text-xs text-slate-500">{{ CONFIG.orderSubtitle }}</p>
        </div>
      </div>

      <h1 class="mt-8 text-3xl font-bold tracking-tight text-slate-900 sm:text-4xl">Оставить заявку</h1>
      <p class="mt-3 text-sm leading-6 text-slate-500">{{ CONFIG.intro }}</p>

      <form v-if="!sent" @submit.prevent="submit" class="mt-8 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-7">
        <!-- honeypot: скрыто от людей, видно ботам -->
        <input v-model="website" type="text" name="website" tabindex="-1" autocomplete="off"
               class="hidden" aria-hidden="true">

        <label class="block">
          <span class="text-sm font-medium text-slate-700">НИК</span>
          <input v-model="nick" required maxlength="120" autocomplete="nickname"
                 placeholder="Ваш ник на форуме"
                 class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200">
        </label>

        <label class="mt-4 block">
          <span class="text-sm font-medium text-slate-700">ПО<span class="ml-1 text-xs text-slate-400">что заказываете</span></span>
          <input v-model="po" maxlength="200"
                 placeholder="Артикул, размер или ссылка"
                 class="mt-1.5 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200">
        </label>

        <label class="mt-4 block">
          <span class="text-sm font-medium text-slate-700">Примечание</span>
          <textarea v-model="note" maxlength="500"
                    placeholder="Пожелания, цвет, сроки"
                    class="mt-1.5 min-h-[92px] w-full resize-y rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"></textarea>
        </label>

        <p v-if="error" role="alert" class="mt-4 rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">{{ error }}</p>

        <button type="submit" :disabled="submitting"
                class="mt-6 w-full rounded-lg bg-slate-900 py-2.5 text-sm font-medium text-white transition hover:bg-slate-700 disabled:cursor-not-allowed disabled:opacity-50">
          {{ submitting ? 'Отправляю…' : 'Отправить заявку' }}
        </button>
        <p class="mt-3 text-center text-xs text-slate-400">Заявка попадёт ко мне в кабинет — я свяжусь с вами по нику.</p>
      </form>

      <div v-else class="mt-8 rounded-2xl border border-slate-200 bg-white p-7 text-center shadow-sm sm:p-9">
        <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-emerald-50 text-emerald-600">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
            <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="mt-4 text-xl font-semibold text-slate-900">Заявка отправлена</h2>
        <p class="mt-2 text-sm text-slate-500">Ник <span class="font-medium text-slate-700">{{ sentNick }}</span> — {{ CONFIG.afterSubmit }}</p>
        <button type="button" @click="reset"
                class="mt-6 rounded-lg bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-200">
          Отправить ещё одну
        </button>
      </div>
    </div>
  </main>
  `
}).mount('#app');
</script>
</body>
</html>
