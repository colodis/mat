<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Made by Onshopping</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .greeting {
            text-align: center;
            color: #fff;
            animation: fadeInUp 1.2s ease-out;
        }
        
        .greeting h1 {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            animation: glow 2.5s ease-in-out infinite alternate;
        }
        
        .greeting .highlight {
            background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        
        .greeting p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 20px;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes glow {
            from {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                             0 0 30px rgba(255, 215, 0, 0.1);
            }
            to {
                text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                             0 0 50px rgba(255, 215, 0, 0.4);
            }
        }
        
        @keyframes shimmer {
            to {
                background-position: 200% center;
            }
        }
        
        /* Декоративные плавающие круги */
        .circle {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        
        .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 10%; animation-delay: 0s; }
        .circle:nth-child(2) { width: 120px; height: 120px; top: 70%; left: 80%; animation-delay: 2s; }
        .circle:nth-child(3) { width: 80px; height: 80px; top: 30%; left: 85%; animation-delay: 4s; }
        .circle:nth-child(4) { width: 150px; height: 150px; top: 80%; left: 15%; animation-delay: 1s; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.1); }
        }
    </style>
</head>
<body>
    <!-- Декоративные элементы -->
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    
    <div class="greeting">
        <h1>made by <span class="highlight">Onshopping</span></h1>
        <p>Добро пожаловать</p>
    </div>
</body>
</html>
