<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Made by Onshopping → Matrix</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000; /* чёрный фон под всем — проступает при затухании */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* ---------- Матрица (фон) ---------- */
    #matrix-canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      opacity: 0;
      z-index: 0;
    }
    #matrix-canvas.show {
      opacity: 1;
    }

    /* ---------- Приветствие (поверх) ---------- */
    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      /* плавное затухание слоя — градиент растворяется, проступает чёрный фон */
      transition: opacity 3s ease-in-out;
    }
    .stage.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .greeting {
      text-align: center;
      color: #fff;
      animation: fadeInUp 1.2s ease-out;
    }

    .greeting h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 700;
      letter-spacing: 2px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      margin-bottom: 10px;
      animation: glow 2.5s ease-in-out infinite alternate;
    }

    .greeting .highlight {
      background: linear-gradient(90deg, #ffd700, #ffed4e, #ffd700);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .greeting p {
      font-size: clamp(1rem, 3vw, 1.5rem);
      opacity: 0.9;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 20px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      from {
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                     0 0 30px rgba(255, 215, 0, 0.1);
      }
      to {
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3),
                     0 0 50px rgba(255, 215, 0, 0.4);
      }
    }

    @keyframes shimmer {
      to { background-position: 200% center; }
    }
  </style>
</head>
<body>

  <!-- Матрица (слой 0) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Приветствие (слой 2) -->
  <div class="stage" id="stage">
    <div class="greeting">
      <h1>made by <span class="highlight">Onshopping</span></h1>
      <p>Добро пожаловать</p>
    </div>
  </div>

  <script>
    /* ========== МАТРИЦА ========== */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    let fontSize = 16;
    let columns;
    let rainDrops;
    let matrixStarted = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.ceil(canvas.width / fontSize);
      rainDrops = Array(columns).fill(1);
    }

    resize();
    window.addEventListener('resize', resize);

    const katakana = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const alphabet = katakana.split('');

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#0F0';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < rainDrops.length; i++) {
        const text = alphabet[Math.floor(Math.random() * alphabet.length)];
        ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

        if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          rainDrops[i] = 0;
        }
        rainDrops[i]++;
      }
    }

    function startMatrix() {
      if (matrixStarted) return;
      matrixStarted = true;
      canvas.classList.add('show');   // матрица уже на чёрном фоне
      setInterval(draw, 33);
    }

    /* ========== ПЕРЕХОД ========== */
    const stage = document.getElementById('stage');
    const DARKEN_MS = 3000;          // длительность плавного затемнения
    const DELAY_MS  = 2000;          // задержка перед началом затемнения

    // Через 2 секунды — плавно растворяем градиентный слой (проступает чёрный)
    setTimeout(() => {
      stage.classList.add('fade-out');
    }, DELAY_MS);

    // Стартуем матрицу ровно когда затемнение завершилось (экран полностью чёрный)
    stage.addEventListener('transitionend', (e) => {
      if (e.propertyName === 'opacity') {
        startMatrix();
      }
    });

    // Страховка на случай, если transitionend не сработает
    setTimeout(startMatrix, DELAY_MS + DARKEN_MS + 100);
  </script>
</body>
</html>
